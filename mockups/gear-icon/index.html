<!doctype html><html lang="de"><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Zahnrad-Entwürfe</title>
<style>
/* Layout: Raster aus Entwurfskacheln – je Kachel echter App-Ausschnitt (Icon-Gruppe oben rechts) + 2,5×-Vergleich */
:root {
  --bg: #0b0c12;
  --surface: rgba(40, 42, 54, 0.55);
  --border: rgba(255, 255, 255, 0.12);
  --fg: #ecebf5;
  --muted: #9a99ad;
  --action: rgb(87, 85, 217);          /* @bg_action der App */
  --action-light: rgb(124, 122, 228);
  --font-body: system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); }
.page { padding: 24px 16px 48px; max-width: 1560px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 28px; font-size: 14px; }

/* Gruppen: zwischen Kacheln 28px, innerhalb einer Kachel 10px (Gesetz der Nähe) */
.grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
/* 10 Kacheln ohne Lücke: 1, 2 oder 5 Spalten */
@media (min-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1640px) { .grid { grid-template-columns: repeat(5, 1fr); } }
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 28px; margin-bottom: 28px; }
.head .lead { margin: 0; }
.reference { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.reference .zoom { padding: 8px; gap: 8px; }
.reference .zoom .glass { width: 56px; height: 56px; border-radius: 11px; }
.reference .zoom .glass .icon { width: 36px; height: 36px; }
.tile {
  position: relative; display: flex; flex-direction: column; gap: 10px;
  padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
  cursor: pointer; text-align: left; color: inherit; font: inherit;
}
.tile:focus-visible { outline: 2px solid var(--action-light); outline-offset: 2px; }
.tile.is-selected { background: color-mix(in srgb, var(--action) 20%, var(--surface)); border-color: var(--action-light); box-shadow: 0 0 5px color-mix(in srgb, var(--action) 55%, transparent); }
.tile.is-selected::after {
  content: "✓"; position: absolute; top: -1px; right: 14px; padding: 2px 8px 4px;
  background: var(--action-light); color: #fff; font-weight: 700; border-radius: 0 0 6px 6px;
}
.label { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.tile { min-width: 0; }
.number { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; min-width: 1.4em; }
.name { font-weight: 600; }
.note { color: var(--muted); font-size: 12px; }

<script>
// Gemeinsame Strichstärke wie Info/Hilfe-Icon: 9 von 150 Einheiten (≈1,6px bei 26px)
const STROKE = 9;
const CENTER = 75;

// Punkt auf Kreis um (cx, cy) – Winkel in Grad, 0° = oben
function polar(radius, degrees, cx = CENTER, cy = CENTER) {
  const radians = (degrees - 90) * Math.PI / 180;
  return [(cx + radius * Math.cos(radians)).toFixed(2), (cy + radius * Math.sin(radians)).toFixed(2)];
}

// Parametrisierte Zahnrad-Kontur: Zahnfuß/-kopf als Bögen, optional gerundete Zahnköpfe
function gearPath({ teeth, tipRadius, rootRadius, tipDegrees, baseDegrees, roundTip = false, cx = CENTER, cy = CENTER, rotate = 0 }) {
  const step = 360 / teeth;
  let path = '';
  for (let index = 0; index < teeth; index++) {
    const angle = rotate + index * step;
    const rootStart = polar(rootRadius, angle - baseDegrees / 2, cx, cy);
    const tipStart = polar(tipRadius, angle - tipDegrees / 2, cx, cy);
    const tipEnd = polar(tipRadius, angle + tipDegrees / 2, cx, cy);
    const rootEnd = polar(rootRadius, angle + baseDegrees / 2, cx, cy);
    const nextRoot = polar(rootRadius, angle + step - baseDegrees / 2, cx, cy);
    path += (index === 0 ? `M${rootStart}` : '') + ` L${tipStart}`;
    if (roundTip) {
      // Zahnkopf als Wölbung statt Kreisbogen – wirkt weicher
      const bulge = polar(tipRadius + 9, angle, cx, cy);
      path += ` Q${bulge} ${tipEnd}`;
    } else {
      path += ` A${tipRadius} ${tipRadius} 0 0 1 ${tipEnd}`;
    }
    path += ` L${rootEnd} A${rootRadius} ${rootRadius} 0 0 1 ${nextRoot}`;
  }
  return path + ' Z';
}

const circle = (radius, cx = CENTER, cy = CENTER) => `<circle cx="${cx}" cy="${cy}" r="${radius}"/>`;
const pathTag = (d) => `<path d="${d}"/>`;

function hexagon(radius) {
  const points = [0, 60, 120, 180, 240, 300].map((angle) => polar(radius, angle).join(','));
  return `<polygon points="${points.join(' ')}"/>`;
}

// Ring mit Zahn-Strichen (runde Kappen)
function tickTeeth(count, inner, outer, width) {
  let lines = '';
  for (let index = 0; index < count; index++) {
    const angle = index * 360 / count;
    const [x1, y1] = polar(inner, angle);
    const [x2, y2] = polar(outer, angle);
    lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${width}"/>`;
  }
  return lines;
}

// Gefüllte Zahn-Noppen außen am Ring
function solidTeeth(count, rootRadius, tipRadius, tipDegrees, baseDegrees) {
  let shapes = '';
  for (let index = 0; index < count; index++) {
    const angle = index * 360 / count;
    const points = [polar(rootRadius, angle - baseDegrees / 2), polar(tipRadius, angle - tipDegrees / 2), polar(tipRadius, angle + tipDegrees / 2), polar(rootRadius, angle + baseDegrees / 2)];
    shapes += `<polygon fill="#fff" stroke-width="3" points="${points.map((point) => point.join(',')).join(' ')}"/>`;
  }
  return shapes;
}

const VARIANTS = [
  { name: 'Klassisch', note: '8 Zähne, Kontur, rundes Loch',
    body: pathTag(gearPath({ teeth: 8, tipRadius: 64, rootRadius: 51, tipDegrees: 18, baseDegrees: 28 })) + circle(20) },
  { name: 'Sechs Zähne', note: 'breite Zähne, ruhiger',
    body: pathTag(gearPath({ teeth: 6, tipRadius: 64, rootRadius: 49, tipDegrees: 24, baseDegrees: 38 })) + circle(21) },
  { name: 'Im Kreis', note: 'Kreisrahmen wie Info/Hilfe',
    body: circle(60.5) + pathTag(gearPath({ teeth: 8, tipRadius: 40, rootRadius: 31, tipDegrees: 16, baseDegrees: 26 })) + circle(11) },
  { name: 'Ring + Striche', note: 'Ring mit 8 runden Zahn-Strichen',
    body: circle(43) + tickTeeth(8, 52, 62, 13) + circle(15) },
  { name: 'Fein', note: '12 schmale Zähne',
    body: pathTag(gearPath({ teeth: 12, tipRadius: 64, rootRadius: 55, tipDegrees: 9, baseDegrees: 16 })) + circle(25) },
  { name: 'Hex-Nabe', note: 'Sechseck-Loch wie die Spielfelder',
    body: pathTag(gearPath({ teeth: 8, tipRadius: 64, rootRadius: 51, tipDegrees: 18, baseDegrees: 28 })) + hexagon(23) },
  { name: 'Weich', note: 'gewölbte Zahnköpfe',
    body: pathTag(gearPath({ teeth: 8, tipRadius: 58, rootRadius: 49, tipDegrees: 20, baseDegrees: 30, roundTip: true })) + circle(19) },
  { name: 'Geschwungen', note: 'Lucide-Stil, fließende Kontur',
    body: `<g transform="translate(3 3) scale(6)" stroke-width="${STROKE / 6}"><path d="${LUCIDE_SETTINGS}"/><circle cx="12" cy="12" r="3"/></g>` },
  { name: 'Zwei Zahnräder', note: 'groß + klein, greifen ineinander',
    body: pathTag(gearPath({ teeth: 8, tipRadius: 45, rootRadius: 35, tipDegrees: 20, baseDegrees: 32, cx: 58, cy: 58 })) + circle(12, 58, 58)
        + pathTag(gearPath({ teeth: 6, tipRadius: 28, rootRadius: 20, tipDegrees: 24, baseDegrees: 40, cx: 108, cy: 108, rotate: 30 })) + circle(7, 108, 108) },
  { name: 'Ring + Noppen', note: 'Kreis wie Info/Hilfe, volle Zähne',
    body: circle(48) + solidTeeth(8, 50, 63, 16, 26) + circle(16) },
];

function gearSvg(variant) {
  return `<svg viewBox="0 0 150 150" fill="none" stroke="#fff" stroke-width="${STROKE}" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${variant.body}</svg>`;
}



const grid = document.getElementById('grid');
VARIANTS.forEach((variant, index) => {
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'tile';
  tile.id = `variant-${index + 1}`;
  tile.innerHTML = `
    <div class="label"><span class="number">${index + 1}</span><span class="name">${variant.name}</span><span class="note">${variant.note}</span></div>
    <div class="context">
      <div class="toolbar">
        <div class="glass player"><i></i></div>
        <div class="glass language"><i></i></div>
        <div class="glass cards"><i class="icon"></i><div class="deck">64<br>92</div></div>
        <div class="glass info"><i class="icon"></i></div>
        <div class="glass help"><i class="icon"></i></div>
        <div class="glass settings">${gearSvg(variant)}</div>
      </div>
    </div>
    <div class="zoom">
      <div class="glass info"><i class="icon"></i></div>
      <div class="glass help"><i class="icon"></i></div>
      <div class="glass settings">${gearSvg(variant)}</div>
    </div>`;
  // Favorit markieren – nur eine Kachel gleichzeitig
  tile.addEventListener('click', () => {
    const wasSelected = tile.classList.contains('is-selected');
    grid.querySelectorAll('.is-selected').forEach((element) => element.classList.remove('is-selected'));
    if (!wasSelected) tile.classList.add('is-selected');
  });
  grid.appendChild(tile);
});
</script>
