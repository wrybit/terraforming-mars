name: CI

on:
  pull_request:
  push:
    # Fork: branches only – the approval tags (approved/*) point at commits that were already checked
    branches: ['**']

jobs:
  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - run: npm ci
    - run: npm run make:static
    # Fork: build before lint – the translation check (lint:i18n) needs the generated card data of the build
    - run: npm run build
    - run: npm run lint
    - run: npm run build:tests
    - run: npm test

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - run: npm ci
    - run: npm run make:static
    # Fork: build before lint – the translation check (lint:i18n) needs the generated card data of the build
    - run: npm run build
    - run: npm run lint
    - run: npm run build:tests
    - run: npm test

  build-docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - run: docker build .


